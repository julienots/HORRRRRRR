<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { buildDoll } from '/src/actors/dollModel.js';
import { DollAnimator } from '/src/actors/dollAnim.js';
import { createRenderer } from '/src/render/renderer.js';
import { QUALITY } from '/src/core/settings.js';
const renderer = createRenderer(document.getElementById('c'), QUALITY.medium);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.01, 50);
const doll = buildDoll(); scene.add(doll.root);

scene.add(new THREE.HemisphereLight(0x8090a0, 0x201810, 0.25));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({color:0x2a1d14})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
window.show = (opts) => {
  const { cam=[0,0.85,0.6], look=[0,0.82,0], loco='idle', action=null, eye='aware', jaw=0, steps=60, lookAt=[0,0.85,1], yaw=0, glow=0.6 } = opts;
  doll.root.rotation.y = yaw;
  Object.assign(anim.state, { loco, action, eye, jaw, glow, stutter: 0, lookAt: new THREE.Vector3(...lookAt), lookMode: 'creepy', moved: loco==='idle'?0:0.02 });
  for (let i=0;i<steps;i++){ doll.root.updateMatrixWorld(true); anim.update(1/60, yaw); }
  camera.position.set(...cam); camera.lookAt(...look);
  renderer.render(scene, camera);
};
window.__ready = true;
</script></body></html>
